name: Mobile

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  # No base-branch filter, so PRs stacked on a mobile feature branch are checked too.
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Mobile install, types, Android export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      # Inlined into the bundle at export time. Placeholders keep CI away from any real project.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: mobile-ci-placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
