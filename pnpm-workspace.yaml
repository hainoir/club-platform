# Single-package workspace so pnpm settings live here.
# Dependabot injects minimumReleaseAge=4320 (3d cooldown); these
# packages publish often and otherwise block lockfile updates.
packages:
  - '.'

minimumReleaseAgeExclude:
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - node-releases
  - '@babel/*'
